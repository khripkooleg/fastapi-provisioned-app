name: "Test and Deploy Python Application"

on:
  push:
    branches: ['develop', 'main']
  pull_request:
    branches: ['develop', 'main']

env:
  DOCKER_REPOSITORY: okhripko/fastapi-endpoint-app
  ECR_REPOSITORY: main_ecr_repository
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    name: "Install Python Dependencies and Perform Lint-and-Test"
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Install Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: "Install Dependencies"
        run: |
          python3 -m pip install --upgrade pip
          pip install --no-cache-dir ruff
          if [ -f requirements.txt ]; then pip install --no-cache-dir -r requirements.txt; fi
      
      - name: "Ruff Check and Format Verification"
        continue-on-error: true
        run: |
          ruff check --fix main/
          ruff format --check main/

      - name: "Run PyTests"
        run: python -m pytest

  build-and-push:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'
    name: "Build the Docker Image and Push to Dual Registries"
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Log In To Docker Hub" 
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Log In to Amazon ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: "Set Up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build And Push Dual Registries"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t ${{ env.DOCKER_REPOSITORY }}:$IMAGE_TAG \
            -t ${{ env.DOCKER_REPOSITORY }}:latest \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest .

          docker push ${{ env.DOCKER_REPOSITORY }}:$IMAGE_TAG
          docker push ${{ env.DOCKER_REPOSITORY }}:latest

          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    name: "Deploy to EC2 && Smoke Test"
    steps:
      - name: "Deploy to EC2 via SSH"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

            cd ~/app
            docker compose pull
            docker compose up -d --build --remove-orphans

      - name: Wait and Smoke Test Endpoint
        run: |
          echo "Waiting for microservice to become ready..."
          URL="http://${{ secrets.EC2_HOST }}/docs"
          
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "Attempt $i: Received HTTP status $STATUS"
            
            if [ "$STATUS" -eq 200 ]; then
              echo "Smoke test passed! App is healthy."
              exit 0
            fi
            
            sleep 5
          done
          
          echo "Smoke test failed: Service did not return HTTP 200."
          exit 1
